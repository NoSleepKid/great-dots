# #######################################################################################
# HYPRLAND CONFIG – RICED, MEDIUM-FAST ANIMS, TIGHT GAPS, FULL FILE
# #######################################################################################

####################
### ENV / CURSOR ###
####################
env = XCURSOR_THEME,Breeze
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,arc-dark
env = GTK_THEME,Arc-Dark
env = WLR_RENDERER_ALLOW_SOFTWARE,1

exec-once = hyprctl setcursor Breeze 24

#################
### VARIABLES ###
#################
$mainMod     = SUPER
$terminal    = kitty
$fileManager = dolphin
$menu        = wofi --show drun

bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S').png

################
### MONITORS ###
################
monitor = DP-1, 1920x1080@60, 0x0, 1
monitor = DP-2, 2560x1440@60, 1920x0, 1

#################
### AUTOSTART ###
#################
exec-once = systemctl --user start pipewire pipewire-pulse wireplumber
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start xdg-desktop-portal-hyprland

exec-once = waybar &
exec-once = hyprpaper &
exec-once = nm-applet &
exec-once = blueman-applet &
exec-once = ~/Greet.sh &

##################
### WINDOWRULE ###
##################
windowrulev2 = fullscreen, class:FastfetchSaver
windowrulev2 = float, class:FastfetchSaver
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1

#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_options =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

######################
### DEVICE CONFIGS ###
######################
input {
    kb_layout = us
    resolve_binds_by_sym = 1
    kb_options =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

###################
### LOOK & FEEL ###
###################
general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2
    resize_on_border = false
    allow_tearing = false
    layout = dwindle

    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(45475aaa)
}

decoration {
    rounding = 6
    rounding_power = 1
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 4
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.22
    }
}

###################
### ANIMATIONS  ###
###################
animations {
    enabled = true

    bezier = smoothsnap, 0.22, 0.85, 0.15, 1
    bezier = softout, 0.2, 0, 0.2, 1

    animation = windows,     1, 3.8, smoothsnap
    animation = windowsIn,   1, 3.4, smoothsnap, popin 90%
    animation = windowsOut,  1, 1.8, softout, popin 90%
    animation = fade,        1, 2.4, softout
    animation = workspaces,  1, 2.2, smoothsnap, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    vrr = 1
}

###################
### KEYBINDS    ###
###################

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, sh -c 'pgrep -x wofi >/dev/null || wofi --show drun'

bind = $mainMod, C, killactive
bind = SUPER ALT, Delete, forcekillactive
bind = $mainMod, code:54, killactive
bind = $mainMod, code:119, killactive

bind = $mainMod, V, togglefloating
bind = $mainMod, M, exit
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, H, movetoworkspacesilent, special

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
