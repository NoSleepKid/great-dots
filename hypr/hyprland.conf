# #######################################################################################
# HYPRLAND CONFIG – RICED, MEDIUM-FAST ANIMS, TIGHT GAPS (CLEANED & OPTIMIZED 2026)
# #######################################################################################

####################
### ENV / CURSOR ###
####################
env = HYPRCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,arc-dark
env = QT_QPA_PLATFORM,xcb
env = GTK_THEME,Arc-Dark
env = GDK_BACKEND,wayland,x11

env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1
env = WLR_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1

xwayland {
    enabled = true
}

#################
### VARIABLES ###
#################
$mainMod = SUPER
$terminal = alacritty
$fileManager = dolphin
$menu = rofi -show drun

################
### MONITORS ###
################
monitor = DP-2,2560x1440@60,0x0,1
monitor = DP-1,1920x1080@60,-1920x0,1
monitor = HDMI-A-2,1920x1080@60,2560x0,1

# Keep workspaces mapped to specific hardware
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-2, default:true
workspace = 3, monitor:HDMI-A-2, default:true

#################
### AUTOSTART ###
#################
exec-once = rclone mount gdrive: /home/$USER/gdrive --vfs-cache-mode writes --dir-cache-time 72h --buffer-size 256M --poll-interval 15s
exec-once = systemctl --user start pipewire pipewire-pulse wireplumber
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start xdg-desktop-portal-hyprland
exec-once = hyprpaper
exec-once = nm-applet
exec-once = blueman-applet
exec-once = ~/Greet.sh
exec-once = gammastep -l 47.7:-117.1
exec-once = hypridle
exec-once = sleep 2 && hyprctl setcursor breeze_cursors 24
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = thunderbird --headless
exec-once = GDK_BACKEND=wayland waybar

##################
### WINDOWRULE ###
##################

# Suppress maximize event on ALL windows
windowrule {
    name = no_maximize_event
    match:class = .*
    suppress_event = maximize
}

# Empty class/title windows (floating + no focus)
windowrule {
    name = empty_windows
    match:class = ^$
    match:title = ^$
    float = on
    no_focus = on
}

# Firefox / LibreWolf fixes — no more menus teleporting to another monitor
windowrule {
    name = librewolf_cursor_fix
    match:class = ^(librewolf)$
    opaque = on
    no_initial_focus = off
}

# GIMP cursor fix — no more focus/opacity issues
windowrule {
    name = gimp_cursor_fix
    match:class = ^(org.gimp.GIMP)$
    opaque = on
    no_initial_focus = off
}

###################
### LOOK & FEEL ###
###################
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 5
    resize_on_border = false
    allow_tearing = false
    layout = dwindle

    col.active_border = rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(313244cc)
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.22
        new_optimizations = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

###################
### ANIMATIONS ###
###################
animations {
    enabled = true

    bezier = smoothsnap,0.22,0.85,0.15,1
    bezier = softout,0.2,0,0.2,1

    animation = windows,1,2.5,smoothsnap
    animation = windowsIn,1,2.5,smoothsnap,popin 90%
    animation = windowsOut,1,2.5,softout,popin 90%
    animation = fade,1,2.4,softout
    animation = workspaces,0,2.8,smoothsnap,slide
}

###################
### INPUT / MISC ###
###################
input {
    kb_layout = us
    kb_options =
    resolve_binds_by_sym = 1
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    animate_manual_resizes = false
    vrr = 2
    vfr = true
}

cursor {
    no_warps = true
    no_hardware_cursors = true
}

xwayland {
    enabled = true
}

# #######################################################################################
# KEYBINDS (UNTOUCHED)
# #######################################################################################
bind = $mainMod,Q,exec,$terminal
bind = $mainMod,E,exec,$fileManager
bind = SUPER,D,exec,env GDK_BACKEND=x11 rofi -show drun
bind = $mainMod,C,killactive
bind = $mainMod,Delete,killactive
bind = SUPER ALT,Delete,forcekillactive
bind = $mainMod,V,togglefloating
bind = $mainMod,M,exit
bind = $mainMod,F,fullscreen,0
bind = $mainMod SHIFT,F,fullscreen,1
bind = $mainMod,TAB,exec,hyprlock
bind = SUPER ALT,SPACE,exec,notify-send "Shutdown Scheduled" "PC will shut down in 5 minutes." && shutdown -h +5
bind = SUPER SHIFT,SPACE,exec,shutdown -c && notify-send "Shutdown Cancelled"
bind = SUPER,F1,exec,systemctl poweroff
bind = SUPER,SPACE,exec,~/.config/hypr/scripts/powermenu.sh
bind = $mainMod, W, exec, pkill waybar && waybar
bind = $mainMod SHIFT, W, exec, pkill hyprpaper && hyprpaper
bind = $mainMod,1,workspace,1
bind = $mainMod,2,workspace,2
bind = $mainMod,3,workspace,3
bind = $mainMod,4,workspace,4
bind = $mainMod,5,workspace,5
bind = $mainMod,6,workspace,6
bind = $mainMod,7,workspace,7
bind = $mainMod,8,workspace,8
bind = $mainMod,9,workspace,9
bind = $mainMod,0,workspace,10
bind = $mainMod SHIFT,1,movetoworkspace,1
bind = $mainMod SHIFT,2,movetoworkspace,2
bind = $mainMod SHIFT,3,movetoworkspace,3
bind = $mainMod SHIFT,4,movetoworkspace,4
bind = $mainMod SHIFT,5,movetoworkspace,5
bind = $mainMod SHIFT,6,movetoworkspace,6
bind = $mainMod SHIFT,7,movetoworkspace,7
bind = $mainMod SHIFT,8,movetoworkspace,8
bind = $mainMod SHIFT,9,movetoworkspace,9
bind = $mainMod SHIFT,0,movetoworkspace,10
bind = $mainMod, Y, exec, $fileManager
bind = $mainMod,left,movefocus,l
bind = $mainMod,right,movefocus,r
bind = $mainMod,up,movefocus,u
bind = $mainMod,down,movefocus,d
bind = $mainMod,S,togglespecialworkspace,magic
bind = $mainMod,H,movetoworkspacesilent,specia
bindm = $mainMod,mouse:272,movewindow
bindm = $mainMod,mouse:273,resizewindow
bind = SUPER SHIFT,S,exec,bash -c 'file=~/Screenshots/$(date +"%Y-%m-%d_%H-%M-%S").png; grim -g "$(slurp)" - | swappy -f - -o "$file" && wl-copy < "$file" && notify-send "Screenshot saved and copied" "$file"'
bind = ,XF86AudioRaiseVolume,exec,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioMute,exec,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86MonBrightnessUp,exec,brightnessctl set 5%+
bind = ,XF86MonBrightnessDown,exec,brightnessctl set 5%-
