background {
    color = rgba(5, 10, 5, 0.95)
}

# --- Username (Top of screen) ---
label {
    text = cmd[update:60000] whoami
    color = rgba(0, 255, 120, 1.0)
    font_size = 28
    position = 0, -30
    halign = center
    valign = top
}

# --- Clock ---
label {
    text = cmd[update:1000] bash -c 'if [ "$(date +%m%d%H)" = "123123" ]; then date +"%I:%M:%S %p"; else date +"%I:%M %p"; fi'
    color = rgba(0, 255, 120, 1.0)
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

# --- Date ---
label {
    text = cmd[update:60000] date +"%A, %B %d, %Y"
    color = rgba(0, 180, 80, 1.0)
    font_size = 20
    position = 0, 60
    halign = center
    valign = center
}

# --- Password Field ---
input-field {
    size = 320, 55
    outline_thickness = 3
    dots_size = 0.35
    dots_spacing = 0.25
    outer_color = rgba(0, 120, 0, 1.0)
    inner_color = rgba(0, 0, 0, 0.85)
    font_color = rgba(0, 255, 120, 1.0)
    fade_on_empty = false
    placeholder_text = "Access Code"
    placeholder_color = rgba(0, 150, 60, 0.6)
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}

