# ~/.config/hypr/hyprpaper.conf – Updated 2026 block syntax

# Preload the image(s) – still uses old-style line, with space around =
preload = /home/sleep/Pictures/Tvbcx.jpeg

# Global/fallback wallpaper (applies to ALL monitors if no specific match)
wallpaper {
    monitor =
    path = /home/sleep/Pictures/Tvbcx.jpeg
    fit_mode = cover   # optional; cover is default, but explicit is safer
}

# Optional: disable splash text
splash = false
